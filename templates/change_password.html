{% extends "base.html" %}
{% block page_title %}تغییر رمز عبور{% endblock %}

{% block styles %}
<style>
    .password-container {
        max-width: 500px;
        margin: 2rem auto;
        background: #fff;
        border-radius: 20px;
        padding: 2.5rem;
        box-shadow: 0 8px 32px rgba(0,0,0,0.06);
        border: 1px solid #eef2f6;
    }
    .password-container .header {
        text-align: center;
        margin-bottom: 2rem;
    }
    .password-container .header i {
        font-size: 3rem;
        color: #3b82f6;
        background: #e8f0fe;
        padding: 1rem;
        border-radius: 50%;
        margin-bottom: 1rem;
    }
    .password-container .header h4 {
        font-weight: 700;
        color: #0f2b5e;
        margin: 0;
    }
    .password-container .header p {
        color: #64748b;
        margin-top: 0.3rem;
        font-size: 0.9rem;
    }
    .password-container .form-control {
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        padding: 0.7rem 1rem;
        transition: all 0.2s;
    }
    .password-container .form-control:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
        outline: none;
    }
    .password-container .form-label {
        font-weight: 600;
        color: #1e293b;
        font-size: 0.9rem;
    }
    .password-container .btn-submit {
        background: linear-gradient(135deg, #0f2b5e, #3b82f6);
        border: none;
        color: #fff;
        padding: 0.7rem;
        border-radius: 30px;
        font-weight: 600;
        width: 100%;
        transition: all 0.3s;
        font-size: 1rem;
    }
    .password-container .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(59,130,246,0.3);
        color: #fff;
    }
    .password-container .btn-cancel {
        border: 2px solid #e2e8f0;
        background: transparent;
        color: #475569;
        padding: 0.7rem;
        border-radius: 30px;
        font-weight: 600;
        width: 100%;
        transition: all 0.3s;
        text-align: center;
        text-decoration: none;
        display: inline-block;
    }
    .password-container .btn-cancel:hover {
        background: #f1f5f9;
    }
    .password-container .divider {
        border-top: 1px solid #eef2f6;
        margin: 1.5rem 0;
    }
    .password-strength {
        height: 4px;
        border-radius: 4px;
        margin-top: 0.3rem;
        transition: all 0.3s;
        background: #e2e8f0;
    }
    .password-strength.weak { background: #ef4444; width: 25%; }
    .password-strength.medium { background: #f59e0b; width: 50%; }
    .password-strength.strong { background: #10b981; width: 75%; }
    .password-strength.very-strong { background: #3b82f6; width: 100%; }
</style>
{% endblock %}

{% block content %}

<div class="password-container">
    <div class="header">
        <i class="fas fa-key"></i>
        <h4>تغییر رمز عبور</h4>
        <p>برای امنیت بیشتر، رمز خود را به‌طور منظم تغییر دهید</p>
    </div>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">رمز عبور فعلی</label>
            <input type="password" name="current_password" class="form-control" placeholder="رمز عبور فعلی را وارد کنید" required>
        </div>

        <div class="mb-3">
            <label class="form-label">رمز عبور جدید</label>
            <input type="password" name="new_password" class="form-control" id="newPassword" placeholder="حداقل ۶ کاراکتر" required>
            <div class="password-strength" id="strengthBar"></div>
            <small class="text-muted" id="strengthText">ضعف رمز را نشان می‌دهد</small>
        </div>

        <div class="mb-3">
            <label class="form-label">تأیید رمز عبور جدید</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="رمز جدید را دوباره وارد کنید" required>
            <small class="text-muted" id="matchStatus"></small>
        </div>

        <button type="submit" class="btn-submit">
            <i class="fas fa-save me-2"></i> تغییر رمز عبور
        </button>

        <div class="divider"></div>

        <a href="{{ url_for('index') }}" class="btn-cancel">
            <i class="fas fa-arrow-right me-2"></i> بازگشت به داشبورد
        </a>
    </form>
</div>

{% endblock %}

{% block scripts %}
<script>
$(function(){
    // ===== قدرت رمز =====
    $('#newPassword').on('input', function() {
        const password = $(this).val();
        const bar = $('#strengthBar');
        const text = $('#strengthText');
        
        if (password.length === 0) {
            bar.removeClass('weak medium strong very-strong');
            text.text('ضعف رمز را نشان می‌دهد');
            return;
        }
        
        let score = 0;
        if (password.length >= 6) score++;
        if (password.length >= 10) score++;
        if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
        if (/\d/.test(password)) score++;
        if (/[^a-zA-Z0-9]/.test(password)) score++;
        
        bar.removeClass('weak medium strong very-strong');
        if (score <= 1) {
            bar.addClass('weak');
            text.text('ضعیف');
            text.css('color', '#ef4444');
        } else if (score <= 2) {
            bar.addClass('medium');
            text.text('متوسط');
            text.css('color', '#f59e0b');
        } else if (score <= 3) {
            bar.addClass('strong');
            text.text('قوی');
            text.css('color', '#10b981');
        } else {
            bar.addClass('very-strong');
            text.text('بسیار قوی');
            text.css('color', '#3b82f6');
        }
    });

    // ===== تطابق رمز =====
    $('input[name="confirm_password"]').on('input', function() {
        const newPass = $('#newPassword').val();
        const confirmPass = $(this).val();
        const status = $('#matchStatus');
        
        if (confirmPass.length === 0) {
            status.text('');
            return;
        }
        
        if (newPass === confirmPass) {
            status.text('✓ رمزها مطابقت دارند');
            status.css('color', '#10b981');
        } else {
            status.text('✗ رمزها مطابقت ندارند');
            status.css('color', '#ef4444');
        }
    });
});
</script>
{% endblock %}
